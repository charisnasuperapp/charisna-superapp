name: android-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (generates cordova plugins module + web assets)
        run: |
          mkdir -p android/app/src/main/assets/public
          cp www/index.html android/app/src/main/assets/public/index.html
          npx cap sync android --inline

      - name: Syntax check and full test suite
        run: |
          node scripts/check.mjs
          node --test tests/*.test.mjs

      - name: Restore signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/charisna-release.keystore
          test -s android/charisna-release.keystore

      - name: Build signed universal APK (all ABIs, phone + tablet)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/charisna-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Prepare release artifact
        run: |
          TAG="${GITHUB_REF_NAME:-local}"
          mkdir -p release
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in
            *unsigned*) echo "APK is not signed: $APK"; exit 1;;
          esac
          cp "$APK" "release/charisna-superapp-${TAG}-universal.apk"
          sha256sum "release/charisna-superapp-${TAG}-universal.apk" > "release/charisna-superapp-${TAG}-universal.apk.sha256"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: charisna-superapp-apk
          path: release/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber \
            --repo "${GITHUB_REPOSITORY}" || \
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "CHARISNA SuperApp — web (Cloudflare Worker) + Android universal APK (signed)." \
            --repo "${GITHUB_REPOSITORY}"
